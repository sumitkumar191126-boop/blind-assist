<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Assist v5</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 10px 26px; background: #111; color: #eee; font-family: Arial, sans-serif; text-align: center; }
  h1 { margin: 6px 0; font-size: 24px; }
  #note { max-width: 680px; margin: 6px auto 10px; color: #bbb; line-height: 1.4; font-size: 13px; }
  #status { font-size: 16px; margin: 8px auto; min-height: 22px; }
  #btn { width: 92vw; max-width: 640px; font-size: 28px; padding: 24px 0; margin: 8px; border-radius: 16px; border: 0; background: #2e8b57; color: #fff; cursor: pointer; }
  #btn:disabled { opacity: .55; cursor: wait; }
  #spoken { font-size: 24px; margin: 8px auto; color: #ffd54a; min-height: 32px; max-width: 700px; }
  #scene { font-size: 15px; color: #8ecbff; min-height: 20px; }
  #wrap { position: relative; width: min(640px, 96vw); margin: 10px auto; background: #222; overflow: hidden; }
  video, canvas { width: 100%; height: auto; display: block; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<h1>Blind Assist</h1>
<div id="note">Experimental prototype. Not a safe navigation or mobility aid. Keep a trusted person with you while testing.</div>
<div id="status">Start dabao</div>
<button id="btn">Start</button>
<div id="spoken" aria-live="polite"></div>
<div id="scene"></div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const spokenEl = document.getElementById("spoken");
const sceneEl = document.getElementById("scene");
const btn = document.getElementById("btn");

// ================= SETTINGS =================
const SCENE_MODEL_URL = "https://teachablemachine.withgoogle.com/models/FEHYjMU6z/";
const SCENE_MIN_CONF = 0.8;
const SCENE_EVERY_N_LOOPS = 2;

const MIN_SCORE = 0.5;
const LOOP_DELAY_MS = 350;
const NEAR_AREA = 0.15, VERY_NEAR_AREA = 0.4;
const BLOCK_COOLDOWN_MS = 3000, CLEAR_COOLDOWN_MS = 8000;
const CLEAR_FRAMES_NEEDED = 3;
const CENTER_STREAK_NEEDED = 2;

let objectModel = null, sceneModel = null, sceneLabels = [];
let cameraStream = null, running = false, wakeLock = null, loopTimer = null, loopCount = 0;

// ================= Speech + vibration =================
let hindiVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  hindiVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("hi")) || null;
}
pickVoice();
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = pickVoice;

const lastSpoken = {};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function speak(hiText, enText, key, cooldown, urgent = false, vib = null) {
  if (!("speechSynthesis" in window)) return;
  const now = Date.now();
  if (lastSpoken[key] && now - lastSpoken[key] < cooldown) return;
  if (speechSynthesis.speaking) {
    if (!urgent) return;
    speechSynthesis.cancel();
  }
  lastSpoken[key] = now;
  if (vib) buzz(vib);
  const text = hindiVoice ? hiText : enText;
  const u = new SpeechSynthesisUtterance(text);
  if (hindiVoice) { u.voice = hindiVoice; u.lang = hindiVoice.lang; } else { u.lang = "en-IN"; }
  u.rate = 1.05;
  speechSynthesis.speak(u);
  spokenEl.textContent = "🔊 " + text;
}

// ================= Camera, screen lock =================
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error("Camera unavailable. Open this page using HTTPS.");
  cameraStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" } } });
  video.srcObject = cameraStream;
  await new Promise(r => { if (video.readyState >= 1) return r(); video.onloadedmetadata = r; });
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}
function stopCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  video.srcObject = null;
}
async function keepScreenOn() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
async function releaseScreenLock() {
  if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
}

// ================= Scene model (Teachable Machine, bina extra library) =================
async function loadSceneModel() {
  sceneModel = await tf.loadLayersModel(SCENE_MODEL_URL + "model.json");
  const meta = await (await fetch(SCENE_MODEL_URL + "metadata.json")).json();
  sceneLabels = meta.labels;
  console.log("Scene labels:", sceneLabels);
}
function sceneKind(label) {
  const l = label.toLowerCase();
  if (l.includes("down")) return "stairs_down";
  if (l.includes("stair") || l.includes("up")) return "stairs_up";
  if (l.includes("wall") || l.includes("door")) return "wall";
  if (l.includes("clear") || l.includes("floor") || l.includes("free")) return "clear";
  return "unknown";
}
let lastScene = null, sceneStreak = 0, scene = "unknown";
async function classifyScene() {
  const probs = tf.tidy(() => {
    let img = tf.browser.fromPixels(video);
    const [h, w] = img.shape, s = Math.min(h, w);
    img = img.slice([Math.floor((h - s) / 2), Math.floor((w - s) / 2), 0], [s, s, 3]);
    img = tf.image.resizeBilinear(img, [224, 224]).toFloat().div(127.5).sub(1).expandDims(0);
    return sceneModel.predict(img);
  });
  const arr = await probs.data();
  probs.dispose();
  let best = 0;
  for (let i = 1; i < arr.length; i++) if (arr[i] > arr[best]) best = i;
  const kind = arr[best] >= SCENE_MIN_CONF ? sceneKind(sceneLabels[best]) : "unknown";
  sceneStreak = (kind === lastScene) ? sceneStreak + 1 : 1;
  lastScene = kind;
  sceneEl.textContent = `Scene: ${sceneLabels[best]} (${Math.round(arr[best] * 100)}%)`;
  return sceneStreak >= 2 ? kind : "unknown";
}

// ================= Objects: direction + distance =================
const getDirection = b => { const r = (b[0] + b[2] / 2) / video.videoWidth; return r < 0.33 ? "left" : r > 0.66 ? "right" : "samne"; };
const getArea = b => (b[2] * b[3]) / (video.videoWidth * video.videoHeight);
const getDistance = a => a > VERY_NEAR_AREA ? "bahut paas" : a > NEAR_AREA ? "thodi door" : "door";

// ================= Decision =================
let clearCount = 0, centerStreak = 0;
function decide(objs) {
  // 1) Scene: seedhi / diwar sabse upar
  if (scene === "stairs_down") { clearCount = 0; speak("सावधान, सीढ़ी नीचे है, रुको", "Careful, stairs going down, stop", "sd", BLOCK_COOLDOWN_MS, true, [300, 100, 300]); return; }
  if (scene === "wall") { clearCount = 0; speak("रुको, सामने दीवार या दरवाज़ा है", "Stop, wall or door ahead", "wall", BLOCK_COOLDOWN_MS, true, [200, 100, 200]); return; }
  if (scene === "stairs_up") { clearCount = 0; speak("सीढ़ी ऊपर जा रही है, सावधान", "Stairs going up, careful", "su", 4000, false, [150]); return; }

  // 2) Objects: sirf direction
  const near = objs.filter(o => o.dist !== "door");
  const center = near.filter(o => o.dir === "samne");
  const leftLoad = near.filter(o => o.dir === "left").reduce((s, o) => s + o.area, 0);
  const rightLoad = near.filter(o => o.dir === "right").reduce((s, o) => s + o.area, 0);
  centerStreak = center.length ? centerStreak + 1 : 0;
  const veryNear = center.some(o => o.dist === "bahut paas");

  if (center.length && (veryNear || centerStreak >= CENTER_STREAK_NEEDED)) {
    clearCount = 0;
    let side = null;
    if (leftLoad === 0 && rightLoad === 0) side = "right";
    else if (leftLoad === 0) side = "left";
    else if (rightLoad === 0) side = "right";
    const vib = veryNear ? [200] : null;
    if (!side) speak("रुको", "Stop", "stop", BLOCK_COOLDOWN_MS, true, [200, 100, 200]);
    else if (side === "left") speak(veryNear ? "रुको, बाएं से जाओ" : "बाएं से जाओ", veryNear ? "Stop, go left" : "Go left", "L" + veryNear, BLOCK_COOLDOWN_MS, veryNear, vib);
    else speak(veryNear ? "रुको, दाएं से जाओ" : "दाएं से जाओ", veryNear ? "Stop, go right" : "Go right", "R" + veryNear, BLOCK_COOLDOWN_MS, veryNear, vib);
    return;
  }
  if (center.length) return;

  // 3) "सीधे जाओ" sirf tab jab scene model bhi "clear floor" bole
  if (scene !== "clear") { clearCount = 0; return; }
  clearCount++;
  if (clearCount >= CLEAR_FRAMES_NEEDED) speak("सीधे जाओ", "Go straight", "straight", CLEAR_COOLDOWN_MS);
}

// ================= Draw =================
function drawAndCollect(predictions) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.33, 0); ctx.lineTo(canvas.width * 0.33, canvas.height);
  ctx.moveTo(canvas.width * 0.66, 0); ctx.lineTo(canvas.width * 0.66, canvas.height);
  ctx.stroke();
  const objs = [];
  for (const p of predictions) {
    if (p.score < MIN_SCORE) continue;
    const area = getArea(p.bbox);
    const o = { class: p.class, area, dir: getDirection(p.bbox), dist: getDistance(area) };
    objs.push(o);
    const [x, y, w, h] = p.bbox;
    const color = o.dist === "bahut paas" ? "#ff5b5b" : "#00e68a";
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    const label = `${o.class} - ${o.dir}, ${o.dist}`;
    ctx.font = "16px Arial";
    const tw = ctx.measureText(label).width, ly = Math.max(0, y - 24);
    ctx.fillStyle = color; ctx.fillRect(x, ly, tw + 10, 24);
    ctx.fillStyle = "#111"; ctx.fillText(label, x + 5, ly + 17);
  }
  return objs;
}

// ================= Main loop =================
async function loop() {
  if (!running) return;
  try {
    loopCount++;
    if (video.readyState >= 2) {
      const predictions = await objectModel.detect(video);
      if (sceneModel && loopCount % SCENE_EVERY_N_LOOPS === 0) scene = await classifyScene();
      const objs = drawAndCollect(predictions);
      statusEl.textContent = objs.length ? `${objs.length} cheez detect hui` : "Kuch detect nahi hua";
      decide(objs);
    }
  } catch (e) {
    console.error("Loop error:", e);
    statusEl.textContent = "Detection issue: " + e.message;
  }
  if (running) loopTimer = setTimeout(() => requestAnimationFrame(loop), LOOP_DELAY_MS);
}

async function stopAssist() {
  running = false;
  if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  await releaseScreenLock();
  stopCamera();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  btn.textContent = "Start";
  statusEl.textContent = "Stopped";
}

btn.addEventListener("click", async () => {
  if (running) { await stopAssist(); return; }
  btn.disabled = true;
  spokenEl.textContent = "";
  try {
    if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    statusEl.textContent = "Camera chalu ho raha hai...";
    await startCamera();
    await keepScreenOn();
    if (!objectModel) {
      statusEl.textContent = "Object model load ho raha hai...";
      objectModel = await cocoSsd.load({ base: "lite_mobilenet_v2" });
    }
    if (!sceneModel) {
      statusEl.textContent = "Scene model load ho raha hai...";
      try { await loadSceneModel(); }
      catch (e) { console.error(e); sceneModel = null; statusEl.textContent = "Scene model load nahi hua. 'Seedhe jao' band rahega."; }
    }
    running = true;
    lastScene = null; sceneStreak = 0; scene = "unknown"; clearCount = 0; centerStreak = 0;
    btn.textContent = "Stop";
    if (sceneModel) statusEl.textContent = "Chal raha hai: object + scene" + (hindiVoice ? " (Hindi voice)" : " (English voice)");
    speak("शुरू", "Started", "start", 0);
    loop();
  } catch (e) {
    console.error(e);
    await stopAssist();
    statusEl.textContent = "Could not start: " + e.message;
  } finally {
    btn.disabled = false;
  }
});

window.addEventListener("pagehide", () => {
  running = false;
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  if ("speechSynthesis" in window) speechSynthesis.cancel();
});
</script>
</body>
</html>
