
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Assist - Object & Scene Detection</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 18px 12px 28px;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h1 {
    margin: 8px 0;
    font-size: 25px;
  }

  #note {
    max-width: 680px;
    margin: 8px auto 14px;
    color: #c9c9c9;
    line-height: 1.45;
    font-size: 14px;
  }

  #status {
    font-size: 17px;
    margin: 12px auto;
    min-height: 24px;
  }

  #btn {
    font-size: 21px;
    padding: 14px 38px;
    margin: 8px;
    border-radius: 12px;
    border: 0;
    background: #2e8b57;
    color: #fff;
    cursor: pointer;
  }

  #btn:disabled {
    opacity: .55;
    cursor: wait;
  }

  #spoken {
    font-size: 21px;
    margin: 12px auto;
    color: #ffd54a;
    min-height: 30px;
    max-width: 700px;
    line-height: 1.4;
  }

  #wrap {
    position: relative;
    width: min(640px, 96vw);
    margin: 12px auto;
    background: #222;
    overflow: hidden;
  }

  video, canvas {
    width: 100%;
    height: auto;
    display: block;
  }

  canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  #legend {
    color: #aaa;
    font-size: 13px;
    margin: 8px auto;
  }
</style>
</head>

<body>

<h1>Blind Assist</h1>

<div id="note">
  Object detection + your trained scene model.
  This is an experimental prototype, not a safe navigation
  or mobility aid. Keep a trusted person with you during testing.
</div>

<div id="status">Start dabao</div>

<button id="btn">Start</button>

<div id="spoken" aria-live="polite"></div>

<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="legend">
  Green boxes: detected objects · Red boxes: large image area
  (not a measured distance)
</div>


<!-- MACHINE LEARNING LIBRARIES -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>


<script>

// ======================================
// PAGE ELEMENTS
// ======================================

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const spokenEl = document.getElementById("spoken");
const btn = document.getElementById("btn");


// ======================================
// YOUR TRAINED TEACHABLE MACHINE MODEL
// ======================================

const SCENE_MODEL_URL =
"https://teachablemachine.withgoogle.com/models/FEHYjMU6z/";


// ======================================
// RUNTIME VARIABLES
// ======================================

let objectModel = null;
let sceneModel = null;

let cameraStream = null;
let running = false;
let wakeLock = null;
let loopTimer = null;

let lastSceneLabel = "";
let lastSceneAt = 0;

let lastObjectAlertAt = 0;
let lastObjectAlertKey = "";


// ======================================
// SETTINGS
// ======================================

const OBJECT_MIN_SCORE = 0.60;

const LARGE_BOX_AREA = 0.18;

const OBJECT_ALERT_COOLDOWN = 4500;

const SCENE_CONFIDENCE = 0.80;

const SCENE_INTERVAL_MS = 1000;

const LOOP_DELAY_MS = 450;


// ======================================
// SPEECH SYSTEM
// ======================================

let hindiVoice = null;

function pickVoice() {

  const voices = window.speechSynthesis
    ? speechSynthesis.getVoices()
    : [];

  hindiVoice =
    voices.find(v =>
      v.lang && v.lang.toLowerCase().startsWith("hi")
    ) || null;

}

if ("speechSynthesis" in window) {

  pickVoice();

  speechSynthesis.onvoiceschanged = pickVoice;

}


function speak(hiText, enText) {

  if (!("speechSynthesis" in window)) return;

  const text = hindiVoice ? hiText : enText;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  if (hindiVoice) {

    utterance.voice = hindiVoice;
    utterance.lang = hindiVoice.lang;

  } else {

    utterance.lang = "en-IN";

  }

  utterance.rate = 1.0;

  spokenEl.textContent = "🔊 " + text;

  speechSynthesis.speak(utterance);

}


// ======================================
// CAMERA SYSTEM
// ======================================

async function startCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "Camera access unavailable. Open this page using HTTPS."
    );

  }

  cameraStream =
    await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {
        facingMode: {
          ideal: "environment"
        }
      }

    });

  video.srcObject = cameraStream;

  await new Promise((resolve, reject) => {

    if (video.readyState >= 1) {
      return resolve();
    }

    video.onloadedmetadata = resolve;

    video.onerror = () =>
      reject(new Error("Video could not start."));

  });

  await video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

}


// ======================================
// KEEP SCREEN ON
// ======================================

async function keepScreenOn() {

  try {

    if ("wakeLock" in navigator) {

      wakeLock =
        await navigator.wakeLock.request("screen");

    }

  } catch (error) {

    console.log("Wake lock unavailable:", error);

  }

}


async function releaseScreenLock() {

  if (wakeLock) {

    try {

      await wakeLock.release();

    } catch (_) {}

    wakeLock = null;

  }

}


// ======================================
// STOP CAMERA
// ======================================

function stopCamera() {

  if (cameraStream) {

    cameraStream.getTracks().forEach(track =>
      track.stop()
    );

    cameraStream = null;

  }

  video.srcObject = null;

}


// ======================================
// OBJECT DETECTION HELPERS
// ======================================

function getDirection(bbox) {

  const centerX =
    (bbox[0] + bbox[2] / 2) / video.videoWidth;

  if (centerX < 0.33) return "left";

  if (centerX > 0.66) return "right";

  return "center";

}


function getBoxAreaRatio(bbox) {

  return (
    (bbox[2] * bbox[3]) /
    (video.videoWidth * video.videoHeight)
  );

}


// ======================================
// DRAW DETECTED OBJECTS
// ======================================

function drawObjects(predictions) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  // Divide screen into three parts

  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(canvas.width * 0.33, 0);
  ctx.lineTo(canvas.width * 0.33, canvas.height);

  ctx.moveTo(canvas.width * 0.66, 0);
  ctx.lineTo(canvas.width * 0.66, canvas.height);

  ctx.stroke();

  let accepted = 0;

  for (const prediction of predictions) {

    if (prediction.score < OBJECT_MIN_SCORE) {
      continue;
    }

    accepted++;

    const [x, y, w, h] = prediction.bbox;

    const areaRatio =
      getBoxAreaRatio(prediction.bbox);

    const boxColor =
      areaRatio >= LARGE_BOX_AREA
        ? "#ff5b5b"
        : "#00e68a";

    const side =
      getDirection(prediction.bbox);

    const label =
      `${prediction.class} (${Math.round(
        prediction.score * 100
      )}%) - ${side}`;

    ctx.strokeStyle = boxColor;
    ctx.lineWidth = 3;

    ctx.strokeRect(x, y, w, h);

    ctx.font = "16px Arial";

    const labelWidth =
      ctx.measureText(label).width;

    const labelY = Math.max(0, y - 24);

    ctx.fillStyle = boxColor;

    ctx.fillRect(
      x,
      labelY,
      labelWidth + 10,
      24
    );

    ctx.fillStyle = "#111";

    ctx.fillText(
      label,
      x + 5,
      labelY + 17
    );

  }

  return accepted;

}


// ======================================
// OBJECT VOICE ALERTS
// ======================================

function maybeAnnounceObject(predictions) {

  const candidates = predictions

    .filter(p =>
      p.score >= OBJECT_MIN_SCORE
    )

    .map(p => ({

      name: p.class,

      score: p.score,

      area: getBoxAreaRatio(p.bbox),

      side: getDirection(p.bbox)

    }))

    .filter(o =>
      o.area >= LARGE_BOX_AREA
    )

    .sort((a, b) =>
      b.area - a.area
    );


  if (!candidates.length) {

    lastObjectAlertKey = "";

    return;

  }


  const item = candidates[0];

  const key =
    `${item.name}-${item.side}`;

  const now = Date.now();


  if (
    key === lastObjectAlertKey &&
    now - lastObjectAlertAt < OBJECT_ALERT_COOLDOWN
  ) {

    return;

  }


  lastObjectAlertKey = key;
  lastObjectAlertAt = now;


  const sideHi =
    item.side === "left"
      ? "बाईं तरफ"
      : item.side === "right"
      ? "दाईं तरफ"
      : "सामने";


  const sideEn =
    item.side === "left"
      ? "on the left"
      : item.side === "right"
      ? "on the right"
      : "in the center";


  speak(
    `${item.name}, ${sideHi} दिखाई दे रहा है।`,
    `${item.name} detected ${sideEn}.`
  );

}


// ======================================
// TEACHABLE MACHINE SCENE CLASSIFICATION
// ======================================

function sceneMessage(className) {

  const key =
    className.toLowerCase().trim();


  if (key === "clear floor") {

    return [

      "फर्श जैसा दृश्य दिखाई दे रहा है। रास्ता सुरक्षित होने की पुष्टि नहीं है।",

      "Floor-like scene detected. This does not confirm the path is safe."

    ];

  }


  if (
    key === "wall door" ||
    key === "wall door close"
  ) {

    return [

      "दीवार या दरवाजे जैसा दृश्य दिखाई दे रहा है।",

      "Wall or door-like scene detected."

    ];

  }


  if (key === "stairs up") {

    return [

      "सीढ़ियों जैसा दृश्य दिखाई दे रहा है। सावधानी रखें।",

      "Stairs-like scene detected. Please use caution."

    ];

  }


  return [

    `${className} जैसा दृश्य दिखाई दे रहा है।`,

    `${className} scene detected.`

  ];

}


// ======================================
// RUN TRAINED SCENE MODEL
// ======================================

async function detectScene() {

  if (
    !sceneModel ||
    !running ||
    video.readyState < 2
  ) {

    return;

  }


  const predictions =
    await sceneModel.predict(video);


  predictions.sort((a, b) =>
    b.probability - a.probability
  );


  const best = predictions[0];


  if (
    !best ||
    best.probability < SCENE_CONFIDENCE
  ) {

    statusEl.textContent =
      "Scene unclear — keep testing safely";

    return;

  }


  const now = Date.now();

  const labelChanged =
    best.className !== lastSceneLabel;

  const intervalPassed =
    now - lastSceneAt >= SCENE_INTERVAL_MS;


  if (
    labelChanged ||
    (
      intervalPassed &&
      best.className === lastSceneLabel
    )
  ) {

    lastSceneLabel = best.className;

    lastSceneAt = now;

    const message =
      sceneMessage(best.className);


    speak(
      message[0],
      message[1]
    );


    statusEl.textContent =
      `Scene: ${best.className} (${
        Math.round(best.probability * 100)
      }%)`;

  }

}


// ======================================
// MAIN DETECTION LOOP
// ======================================

async function loop() {

  if (!running) return;

  try {

    if (
      video.readyState >= 2 &&
      objectModel
    ) {

      const predictions =
        await objectModel.detect(video);


      const count =
        drawObjects(predictions);


      maybeAnnounceObject(predictions);


      if (!lastSceneLabel) {

        statusEl.textContent =
          count
            ? `${count} object(s) detected · checking scene...`
            : "No confident objects detected · checking scene...";

      }

    }


    // Scene classification runs less frequently
    // to reduce device load.

    if (
      running &&
      sceneModel &&
      Date.now() - lastSceneAt >= SCENE_INTERVAL_MS
    ) {

      await detectScene();

    }

  } catch (error) {

    console.error(
      "Detection loop error:",
      error
    );

    statusEl.textContent =
      "Detection issue: " + error.message;

  }


  if (running) {

    loopTimer = setTimeout(() => {

      requestAnimationFrame(loop);

    }, LOOP_DELAY_MS);

  }

}


// ======================================
// STOP ASSIST
// ======================================

async function stopAssist() {

  running = false;

  if (loopTimer) {

    clearTimeout(loopTimer);

    loopTimer = null;

  }


  if ("speechSynthesis" in window) {

    speechSynthesis.cancel();

  }


  await releaseScreenLock();

  stopCamera();


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  btn.textContent = "Start";

  statusEl.textContent = "Stopped";

}


// ======================================
// START BUTTON
// ======================================

btn.addEventListener("click", async () => {

  if (running) {

    await stopAssist();

    return;

  }


  btn.disabled = true;

  statusEl.textContent =
    "Starting camera...";

  spokenEl.textContent = "";


  try {

    // Unlock speech on user interaction

    if ("speechSynthesis" in window) {

      const unlock =
        new SpeechSynthesisUtterance("");

      speechSynthesis.speak(unlock);

    }


    // Start camera

    await startCamera();

    await keepScreenOn();


    // Load COCO-SSD

    if (!objectModel) {

      statusEl.textContent =
        "Loading object detection model...";

      objectModel =
        await cocoSsd.load({

          base: "lite_mobilenet_v2"

        });

    }


    // Load your trained Teachable Machine model

    if (!sceneModel) {

      statusEl.textContent =
        "Loading your trained scene model...";

      sceneModel =
        await tmImage.load(

          SCENE_MODEL_URL + "model.json",

          SCENE_MODEL_URL + "metadata.json"

        );

    }


    // Start detection

    running = true;

    lastSceneLabel = "";
    lastSceneAt = 0;

    lastObjectAlertAt = 0;
    lastObjectAlertKey = "";


    btn.textContent = "Stop";

    statusEl.textContent =
      "Running · object + scene detection";


    speak(
      "ब्लाइंड असिस्ट शुरू हो गया है।",
      "Blind Assist started."
    );


    loop();


  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "Error: " + error.message;

    await stopAssist();

    statusEl.textContent =
      "Could not start: " + error.message;

  } finally {

    btn.disabled = false;

  }

});


// ======================================
// CLEANUP WHEN PAGE CLOSES
// ======================================

window.addEventListener("pagehide", () => {

  running = false;

  if (cameraStream) {

    cameraStream.getTracks().forEach(track =>
      track.stop()
    );

  }

  if ("speechSynthesis" in window) {

    speechSynthesis.cancel();

  }

});

</script>

</body>
</html>
